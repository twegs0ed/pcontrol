{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-exclamation-triangle"></i> Подтверждение удаления
                    </h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-trash fa-4x text-danger mb-3"></i>
                    <h5>Вы уверены, что хотите удалить?</h5>
                    <p>
                        <strong>{{ product.serial_number }}</strong><br>
                        <span class="text-muted">{{ product.category.name }}</span>
                    </p>
                    <p class="text-danger small">
                        <i class="fas fa-exclamation-circle"></i>
                        Это действие нельзя отменить!
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url namespace|default:'unified_products'|add:':product_detail' product.pk %}" 
                               class="btn btn-secondary">
                                <i class="fas fa-times"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
