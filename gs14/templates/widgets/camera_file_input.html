<!-- templates/widgets/camera_file_input.html -->
{% load i18n %}
<div class="camera-widget">
    <div class="file-input-wrapper">
        <input type="file" 
               name="{{ widget.name }}" 
               {% include "django/forms/widgets/attrs.html" %}
               accept="image/*"
               capture="environment"
               class="camera-file-input">
    </div>
    
    {% if widget.value %}
        <div class="current-image">
            <img src="{{ widget.value.url }}" alt="Текущее изображение" class="img-thumbnail">
            <div class="image-actions">
                <button type="button" class="btn btn-sm btn-danger remove-image">
                    <i class="fas fa-times"></i> Удалить
                </button>
            </div>
        </div>
    {% endif %}
    
    <div class="image-preview" style="display: none;">
        <img src="#" alt="Предпросмотр" class="img-thumbnail">
        <button type="button" class="btn btn-sm btn-secondary remove-preview">Отменить</button>
    </div>
</div>
